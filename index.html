<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="site-wrapper">
        <!-- Dynamic Header loaded by nav.js -->
        <header class="site-header" id="header-component"></header>

        <!-- Main Body Area -->
        <div class="main-container">
            
            <!-- Left Sidebar Navigation loaded by nav.js -->
            <aside class="sidebar-left" id="sidebar-nav-component"></aside>

            <!-- Main Content Center -->
            <main class="content-area">
                <div class="hero-image">
                    Welcome
                </div>

                <article class="main-text">
                    <h2>Main content area</h2>
                    <p>
                        This is the Home Page.
                    </p>
                </article>
            </main>

            <!-- Sticky Right Sidebar -->
            <aside class="sidebar-right">
                <div class="sticky-content">
                    <h3>Sticky content such as</h3>
                    <ul>
                        <li>News items</li>
                        <li>Adverts</li>
                        <li>Offers</li>
                        <li>General site info</li>
                        <li>Social Networking icons</li>
                    </ul>
                </div>
            </aside>

        </div>

        <!-- Footer -->
        <footer class="site-footer">
            <p>Contains copyright info, &copy; <span id="year"></span>, primary links, contact, privacy statement, webmaster email address.</p>
            <div class="footer-links">
                <a href="#">Privacy Statement</a> | 
                <a href="contact.html">Contact</a> 
            </div>
        </footer>
    </div>

    <!-- Load Reusable Navigation JS -->
    <script src="nav.js"></script>
    <script>
        // Auto update copyright year
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>John Pezley | Portfolio</title>
  <style>
    /* Basic modern reset and styling */
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding: 0 1.5rem;
    }

    /* Container for layout alignment */
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    /* Navigation */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 0;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-color);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--text-color);
    }

    /* Hero Section */
    .hero {
      padding: 5rem 0;
    }

    .hero h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      line-height: 1.2;
    }

    .hero p {
      font-size: 1.25rem;
      color: var(--text-muted);
      max-width: 600px;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      background-color: var(--accent-color);
      color: #000;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-weight: 600;
      text-decoration: none;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    /* Sections Shared */
    section {
      padding: 4rem 0;
      border-top: 1px solid #334155;
    }

    h2 {
      font-size: 2rem;
      margin-bottom: 2rem;
    }

    /* Projects Grid */
    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
    }

    .project-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 1.5rem;
      border: 1px solid #334155;
    }

    .project-card h3 {
      margin-bottom: 0.5rem;
    }

    .project-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    .tags {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .tag {
      background-color: #334155;
      font-size: 0.75rem;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
    }

    .project-links a {
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 500;
      margin-right: 1rem;
    }

    /* Skills List */
    .skills-group {
      margin-bottom: 1.5rem;
    }

    .skills-group h3 {
      font-size: 1.1rem;
      color: var(--accent-color);
      margin-bottom: 0.5rem;
    }

    /* Footer */
    footer {
      padding: 3rem 0;
      text-align: center;
      color: var(--text-muted);
      border-top: 1px solid #334155;
      font-size: 0.9rem;
    }

    footer a {
      color: var(--text-color);
      margin: 0 0.5rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <nav>
      <a href="#" class="logo">AM.</a>
      <ul class="nav-links">
        <li><a href="#projects">Projects</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>

    <header class="hero">
      <h1>Full-Stack Developer building scalable web applications.</h1>
